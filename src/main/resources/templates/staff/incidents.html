<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incident board</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">OMNI BRIDGE</a>
  <div class="top-actions"><span th:text="${staffName}">staff</span>
    <form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-button" type="submit">Sign out</button></form>
  </div>
</header>
<main class="page">
  <div class="page-heading"><div><p class="eyebrow">Staff workspace</p><h1>Open incidents</h1></div><span class="count" th:text="${incidents.size() + ' open'}">0 open</span></div>
  <p class="flash success" th:if="${message}" th:text="${message}"></p>
  <p class="flash error" th:if="${error}" th:text="${error}"></p>
  <section class="card empty" th:if="${#lists.isEmpty(incidents)}">
    <h2>All clear</h2><p>No open incidents for your venue.</p>
  </section>
  <section class="incident-list" th:unless="${#lists.isEmpty(incidents)}">
    <a class="card incident-card" th:each="incident : ${incidents}"
       th:href="@{/staff/incidents/{id}(id=${incident.id})}">
      <div class="incident-topline"><span class="tag" th:text="${incident.severity}">HIGH</span><span class="muted" th:text="${incident.status}">REPORTED</span></div>
      <h2 th:text="${incident.type + ' · ' + incident.location}">MEDICAL · Lobby</h2>
      <p class="description" th:text="${incident.description}">Description</p>
      <div class="incident-footer"><span th:text="${incident.assignedTo == null ? 'Unassigned' : incident.assignedTo.name}">Unassigned</span><time th:text="${incident.createdAt}"></time></div>
    </a>
  </section>
</main>
<script>
  window.setInterval(() => {
    if (document.visibilityState === "visible") window.location.reload();
  }, 10000);
</script>
</body>
</html>
