<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Incident detail</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a class="brand" href="/">OMNI BRIDGE</a><a href="/staff/incidents">Incident board</a></header>
<main class="page narrow">
  <a class="back-link" href="/staff/incidents">← All incidents</a>
  <p class="flash success" th:if="${message}" th:text="${message}"></p>
  <p class="flash error" th:if="${error}" th:text="${error}"></p>
  <section class="card detail-card">
    <div class="incident-topline"><span class="tag" th:text="${incident.severity}"></span><span class="muted" th:text="${incident.status}"></span></div>
    <h1 th:text="|${incident.type} incident|">Incident</h1>
    <p class="lead" th:text="${incident.location}">Location</p>
    <p th:text="${incident.description}">Description</p>
    <dl class="details">
      <dt>Reported</dt><dd th:text="${incident.createdAt}"></dd>
      <dt>Reporter</dt><dd th:text="${incident.reporterName == null ? 'Not provided' : incident.reporterName}"></dd>
      <dt>Callback</dt><dd th:text="${incident.reporterPhone == null ? 'Not provided' : incident.reporterPhone}"></dd>
      <dt>Assigned to</dt><dd th:text="${incident.assignedTo == null ? 'Unassigned' : incident.assignedTo.name}"></dd>
    </dl>
    <div class="actions wrap">
      <form method="post" th:action="@{/staff/incidents/{id}/acknowledge(id=${incident.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="button secondary" type="submit">Acknowledge</button>
      </form>
      <form method="post" th:action="@{/staff/incidents/{id}/assign-to-self(id=${incident.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button class="button secondary" type="submit">Assign to me</button>
      </form>
      <form class="inline-form" method="post" th:action="@{/staff/incidents/{id}/status(id=${incident.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <select name="status"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == incident.status}"></option></select>
        <button class="button primary" type="submit">Update status</button>
      </form>
    </div>
  </section>
  <section class="card timeline-card">
    <h2>Timeline</h2>
    <ol class="timeline"><li th:each="entry : ${timeline}">
      <time th:text="${entry.createdAt}"></time>
      <p><strong th:text="${entry.author == null ? 'Guest' : entry.author.name}">Staff</strong><span th:text="${entry.message}">Update</span></p>
    </li></ol>
    <form class="form" method="post" th:object="${updateRequest}" th:action="@{/staff/incidents/{id}/updates(id=${incident.id})}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label>Add an update<textarea th:field="*{message}" maxlength="1000" rows="3" required></textarea></label>
      <button class="button primary" type="submit">Post update</button>
    </form>
  </section>
</main>
</body>
</html>
