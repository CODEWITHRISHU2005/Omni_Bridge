<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report received</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a class="brand" href="/">OMNI BRIDGE</a></header>
<main class="page narrow">
  <section class="card confirmation">
    <p class="eyebrow">Report received</p>
    <h1>Venue staff have your report.</h1>
    <p>Reference <strong th:text="${incidentId}">1</strong></p>
    <p class="safety-note">If there is immediate danger, contact local emergency services directly.</p>
    <a class="button secondary" href="/">Return home</a>
  </section>
</main>
</body>
</html>
