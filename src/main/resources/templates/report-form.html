<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report an incident</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="topbar"><a class="brand" href="/">OMNI BRIDGE</a><span>Guest report</span></header>
<main class="page narrow">
  <a class="back-link" href="/">← Home</a>
  <p class="eyebrow" th:text="${venue.name}">Venue name</p>
  <h1>What’s happening?</h1>
  <p class="lead">Your report will be shared with venue staff.</p>
  <div class="notice" th:text="${venue.emergencyInstructions}">If someone is in immediate danger, call local emergency services.</div>

  <form class="card form" method="post"
        th:action="@{/report/{slug}(slug=${venue.slug})}"
        th:object="${reportRequest}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <label>Incident type
      <select th:field="*{type}" required>
        <option value="">Choose a type</option>
        <option th:each="type : ${incidentTypes}" th:value="${type}" th:text="${type}"></option>
      </select>
      <small class="field-error" th:errors="*{type}"></small>
    </label>
    <label>Urgency
      <select th:field="*{severity}" required>
        <option value="">Choose urgency</option>
        <option th:each="severity : ${severities}" th:value="${severity}" th:text="${severity}"></option>
      </select>
      <small class="field-error" th:errors="*{severity}"></small>
    </label>
    <label>Where is it?
      <input th:field="*{location}" maxlength="200" placeholder="Floor, room, or nearby landmark" required>
      <small class="field-error" th:errors="*{location}"></small>
    </label>
    <label>Describe what happened
      <textarea th:field="*{description}" maxlength="2000" rows="5" required></textarea>
      <small class="field-error" th:errors="*{description}"></small>
    </label>
    <div class="two-columns">
      <label>Your name <span class="muted">(optional)</span>
        <input th:field="*{reporterName}" maxlength="160">
      </label>
      <label>Phone <span class="muted">(optional)</span>
        <input th:field="*{reporterPhone}" type="tel" maxlength="40">
      </label>
    </div>
    <button class="button primary full-width" type="submit">Send report</button>
  </form>
  <p class="safety-note">This app notifies venue staff. It does not contact emergency services.</p>
</main>
</body>
</html>
